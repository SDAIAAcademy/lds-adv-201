<section>
<h2>اليوم 1: التأطير وخط الأساس وجاهزية المعرفة</h2>
<ol>
<li><p>طلبت مديرة إدارة الحدائق «تطبيقًا ذكيًا للحجز قبل الصيف». أي صياغة تصلح سؤال قرار لدراسة الجدوى؟</p><ul><li><b>أ.</b> كيف نبني تطبيق الحجز الذكي ونطلقه قبل بداية الصيف؟</li><li><b>ب.</b> كم مستخدمًا سيحجز من التطبيق في شهره الأول؟</li><li><b>ج.</b> هل نموّل التطبيق أم نغيّر إجراء الحجز، بحسب التأخير المقيس؟</li><li><b>د.</b> هل تستطيع التقنيات الحالية بناء تطبيق حجز يفهم العربية؟</li></ul></li>
<li><p>في شباك المراجعين دقق المشرف شهرًا كاملًا الحالات التي اشتكى أصحابها، ثم دقق في الشهر التالي عينة عشوائية. أي رقم تضعه نسبةً للخطأ في خط الأساس؟</p><ul><li><b>أ.</b> العينة العشوائية وحدها، مع عدد الحالات المدققة</li><li><b>ب.</b> نسبة العينتين معًا، لأن العينة الأكبر تعطي رقمًا أدق</li><li><b>ج.</b> نسبة شهر الشكاوى، لأنها تكشف المشكلات الحقيقية للمراجعين</li><li><b>د.</b> لا رقم، فالعينة العشوائية صغيرة</li></ul></li>
<li><p>كتب فريق ملخّص تقارير التفتيش عتبة نجاح 85% قبل التجربة، وجاءت النتيجة 81%. يقترح الفريق خفض العتبة إلى 80% لأن الفرق صغير. ماذا توصي؟</p><ul><li><b>أ.</b> نخفض العتبة، فالفرق أربع نقاط وتجربة واحدة لا تكفي</li><li><b>ب.</b> نوقف الخيار فورًا، فالنتيجة لم تبلغ العتبة المكتوبة</li><li><b>ج.</b> نضيف أسئلة سهلة ونعيد القياس</li><li><b>د.</b> نبقي العتبة ونسمّيها إعادة عمل بخطوات محددة</li></ul></li>
<li><p>قاعدة معرفة شباك المراجعين فيها 20 مقالًا تغطي فئتي «الرخص» و«التصاريح»، ولا مقال لفئة «السداد». حصص الطلب: الرخص 50%، والتصاريح 30%، والسداد 20%. لكن نصف مقالات التصاريح لا نسخة إنجليزية لها. ما أدق وصف للتغطية؟</p><ul><li><b>أ.</b> ثلثا الطلب مغطى، لأن فئتين من ثلاث فيهما مقالات</li><li><b>ب.</b> 80% بالعربية، وأقل بالإنجليزية في التصاريح</li><li><b>ج.</b> التغطية جيدة، فالمقالات عشرون</li><li><b>د.</b> الطلب كله مغطى، لأن السداد يحيل إلى نظام آخر</li></ul></li>
<li><p>طلب مدير النقل البلدي «نظامًا ذكيًا لجدولة الحافلات المدرسية». أي بند يجب أن يظهر في سؤال القرار ليصلح لدراسة جدوى؟</p><ul><li><b>أ.</b> خيار دون نظام ذكي يُقارن بالنظام المطلوب</li><li><b>ب.</b> اسم المورد الذي سيبني النظام</li><li><b>ج.</b> عدد المدارس التي ستستخدم النظام في أول فصل</li><li><b>د.</b> قائمة مزايا النظام الذكي التي يطلبها المدير</li></ul></li>
<li><p>في سجل شكاوى الإنارة، متوسط زمن المعالجة 31 دقيقة ووسيطه 9 دقائق. ما أول ما تفحصه قبل كتابة خط الأساس؟</p><ul><li><b>أ.</b> أن الموظفين يعملون ببطء في الحالات المعقدة</li><li><b>ب.</b> أن الوسيط خطأ في الحساب</li><li><b>ج.</b> حالات بقيت مفتوحة ساعات ثم أغلقها النظام آليًا دون عمل</li><li><b>د.</b> أن الشكاوى العاجلة تحتاج وقتًا أطول دائمًا</li></ul></li>
<li><p>التكلفة السنوية المحمَّلة لموظف 180,000 ريال، وساعاته المنتجة 1,500 ساعة. كم تكلفة دقيقته تقريبًا؟</p><ul><li><b>أ.</b> 1.5 ريال</li><li><b>ب.</b> 2.0 ريال</li><li><b>ج.</b> 0.34 ريال</li><li><b>د.</b> 120 ريالًا</li></ul></li>
<li><p>أي جملة تصلح فرضية قيمة لمساعد يصوغ ردود البريد في إدارة التراخيص؟</p><ul><li><b>أ.</b> سيرفع المساعد كفاءة الإدارة ورضا المراجعين بصورة واضحة وملموسة</li><li><b>ب.</b> سيستخدم المساعد 80% من الموظفين خلال ثلاثة أشهر من إطلاقه</li><li><b>ج.</b> سيقلل المساعد التكاليف لأنه أسرع من البشر</li><li><b>د.</b> إذا صاغ المساعد المسودة، ينخفض زمن الرد من 12 إلى 7 دقائق</li></ul></li>
<li><p>فهرس قاعدة معرفة يقول إن كل المقالات «سارية»، وصدر تعميم بتعديل الرسوم قبل شهرين. ما الدليل الذي يكشف المقالات المتقادمة؟</p><ul><li><b>أ.</b> حقل الحالة في الفهرس، لأنه يحدَّث تلقائيًا عند صدور كل تعميم</li><li><b>ب.</b> تاريخ آخر مراجعة لكل مقال مقارنًا بتاريخ التعميم</li><li><b>ج.</b> عدد مرات فتح كل مقال في الشهر الماضي</li><li><b>د.</b> رأي الموظفين في المقالات التي يستخدمونها</li></ul></li>
<li><p>عشرون قالب رد كتبها مكتب استشاري لإدارة الحدائق بترخيص «للاستخدام الداخلي دون تعديل». كيف تؤثر في خيار بناء مساعد يعيد صياغة الردود؟</p><ul><li><b>أ.</b> تحتاج إذنًا بالتعديل أو إعادة كتابة قبل استخدامها</li><li><b>ب.</b> لا تؤثر، فالقوالب في أنظمة الإدارة منذ سنوات</li><li><b>ج.</b> تمنع خيار البناء كليًا، فلا يمضي إلا خيار لا يستخدمها</li><li><b>د.</b> تؤثر في خيار تغيير الإجراء وحده</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الجاهزية والتجربة التقنية</h2>
<ol>
<li><p>فريق يريد قياس مساعد يلخص شكاوى الإنارة للمشرفين، وعينة الشكاوى فيها أسماء وجوالات وعناوين. ما الحد الأدنى اللازم لتجربة الجدوى؟</p><ul><li><b>أ.</b> العينة كما هي، فالعناوين لازمة لفهم موقع العطل بدقة</li><li><b>ب.</b> حذف الأسماء وإبقاء الجوالات للتواصل مع أصحاب الشكاوى</li><li><b>ج.</b> موافقة كل صاحب شكوى قبل التجربة</li><li><b>د.</b> نص الشكوى دون معرّفات، والحي بدل العنوان</li></ul></li>
<li><p>قدّم مورد عرضًا نجح فيه مساعده في عشرة أسئلة اختارها عن رخص البناء. ما الذي ينقص ليصبح تجربة جدوى؟</p><ul><li><b>أ.</b> أسئلة موسومة تمثل الطلب، وعتبة تُكتب قبل التشغيل</li><li><b>ب.</b> عشرة أسئلة أخرى يختارها المورد</li><li><b>ج.</b> تشغيل الأسئلة العشرة نفسها على نموذج أكبر وأحدث من المورد</li><li><b>د.</b> استبيان لرأي الموظفين الذين حضروا العرض في سهولة الاستخدام</li></ul></li>
<li><p>مساعد لتلخيص محاضر التفتيش صح في 21 من 30، أي 70%، وفترة ويلسون (Wilson interval) من 52% إلى 83%. العتبة المكتوبة قبل التجربة: دقة 75%، وحد أدنى للفترة 60%. ما الحكم؟</p><ul><li><b>أ.</b> يستوفي العتبة، لأن الحد الأعلى للفترة 83% فوق 75%</li><li><b>ب.</b> يستوفيها تقريبًا، فالفرق صغير</li><li><b>ج.</b> لا يستوفيها: الدقة 70% والحد الأدنى 52% كلاهما تحت العتبة</li><li><b>د.</b> لا يمكن أي حكم، فثلاثون سؤالًا لا تكفي لأي قرار مهما كان</li></ul></li>
<li><p>مساعد لإدارة الأحوال البلدية أجاب عن رسم «بدل الفاقد» بمبلغ من مقال لم يُحدَّث بعد تعميم الرسوم الأخير، واستشهد به. أين العلاج الأصح؟</p><ul><li><b>أ.</b> في الإعدادات: رفع عتبة الامتناع (abstention threshold) حتى يمتنع عن كل أسئلة الرسوم</li><li><b>ب.</b> في البيانات: تحديث المقال ومراجعته بعد كل تعميم</li><li><b>ج.</b> في النموذج: نموذج أكبر يعرف أن رسوم الجهة تغيرت هذا العام</li><li><b>د.</b> في الأمر: تعليمة بالتحقق من أحدث رسم</li></ul></li>
<li><p>مساعد يسترجع من مستودع فيه مقالات للمشرفين فقط، ويستخدمه موظفون لا يرون هذه المقالات. ما الضابط الذي يغلق الفجوة؟</p><ul><li><b>أ.</b> تعليمة في الأمر تطلب من النموذج ألا يذكر محتوى المشرفين</li><li><b>ب.</b> مراجعة المشرف لعينة من الإجابات كل أسبوع</li><li><b>ج.</b> تصفية الاسترجاع بصلاحيات المستخدم الذي يسأل، قبل أن يصل أي مقطع إلى النموذج</li><li><b>د.</b> حذف مقالات المشرفين من المستودع نهائيًا</li></ul></li>
<li><p>فريق يريد اختبار مساعد يصوغ الردود، ويقترح تحميل 5,000 ملف حالة حقيقي فيها هويات وجوالات. ما الأنسب لتجربة الجدوى؟</p><ul><li><b>أ.</b> تحميلها كما هي، فالتجربة داخلية ولن تُنشر</li><li><b>ب.</b> حذف الأسماء فقط، فالهوية والجوال لا يكفيان للتعرف</li><li><b>ج.</b> طلب موافقة كل مستفيد قبل استخدام ملفه في التجربة</li><li><b>د.</b> أسئلة موسومة ووثائق اصطناعية دون ملفات حالات</li></ul></li>
<li><p>نموذج أولي أجاب إجابة صحيحة عن 18 سؤالًا من 25. ما أفضل وصف للنتيجة؟</p><ul><li><b>أ.</b> 72%، وهي أعلى من عتبة 70% فالنتيجة ناجحة</li><li><b>ب.</b> 72%، وفترة ثقتها 95% من 52% إلى 86%</li><li><b>ج.</b> 72% بدقة تامة، لأن الأسئلة كلها موسومة</li><li><b>د.</b> لا شيء يُقال عن 25 سؤالًا</li></ul></li>
<li><p>يصمم فريق 30 سؤالًا لاختبار مساعد. 40% من الطلب الفعلي بالإنجليزية، وبعض الطلب عن خدمات لا مقالات لها. أي مجموعة أفضل؟</p><ul><li><b>أ.</b> أسئلة بالعربية والإنجليزية بنسب الطلب، وفيها أسئلة لا جواب لها</li><li><b>ب.</b> 30 سؤالًا كتبها المورد ونجح فيها النموذج في عرضه التوضيحي</li><li><b>ج.</b> 30 سؤالًا عربيًا من المقالات الأكثر وضوحًا، لتكون المقارنة عادلة</li><li><b>د.</b> أسئلة صعبة فقط، لأن السهلة لا تكشف شيئًا عن النموذج</li></ul></li>
<li><p>تشغيل 30 سؤالًا كلّف 0.01 ريال للنموذج، ويراجع الموظف كل إجابة في دقيقتين بتكلفة 2 ريال للدقيقة، وصحّت 20 إجابة. كم التكلفة لكل إجابة صحيحة تقريبًا؟</p><ul><li><b>أ.</b> 0.0005 ريال</li><li><b>ب.</b> 4 ريالات</li><li><b>ج.</b> 6 ريالات</li><li><b>د.</b> 120 ريالًا</li></ul></li>
<li><p>بعد تكييف مساعد لتلخيص محاضر التفتيش ارتفعت الدقة من 14 إلى 19 محضرًا من 25، على المحاضر نفسها: تحسن 6 وساء محضر واحد. ما الاستنتاج الأدق؟</p><ul><li><b>أ.</b> لا فرق، فالفترتان متداخلتان</li><li><b>ب.</b> التكييف كله نافع، فالسؤال الذي ساء لا يُحتسب</li><li><b>ج.</b> التحسن من النموذج الجديد، فالإعدادات لا تغير شيئًا</li><li><b>د.</b> تحسن حقيقي، ومحضر واحد يحتاج فحص سبب تراجعه</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: المخاطر والخيارات ودراسة الجدوى</h2>
<ol>
<li><p>مساعد يقترح مبلغ التعويض عن أضرار الحفريات في ممتلكات السكان، ثم يُصرف المبلغ لصاحبه. أي نمط إشراف يلزمه؟</p><ul><li><b>أ.</b> عينة شهرية من التعويضات بعد صرفها</li><li><b>ب.</b> موظف يقرر المبلغ في كل حالة قبل الصرف</li><li><b>ج.</b> إشعار المستفيد بأن المبلغ مقترح آليًا وله حق الاعتراض عليه</li><li><b>د.</b> مراقبة متوسط مبالغ التعويض كل شهر ومقارنته بالسنة الماضية</li></ul></li>
<li><p>خطر في مساعد داخلي: «تتعطل خدمة الترجمة المستضافة ساعة كل أسبوع، فيترجم الموظف يدويًا». قدّرت الاحتمالية مرجحة (3) والأثر منخفضًا (1). ما مستوى الخطر وما الاستجابة الأنسب؟</p><ul><li><b>أ.</b> مرتفع (12): يُتجنب بالإيقاف</li><li><b>ب.</b> كارثي، لأنه يتكرر كل أسبوع، فيُصعّد إلى لجنة المخاطر فورًا</li><li><b>ج.</b> منخفض (3)، فيُقبل دون توثيق لأنه لا يمس السكان أبدًا</li><li><b>د.</b> متوسط (3): يُخفف أو يُقبل بسبب موثق</li></ul></li>
<li><p>مساعد يوفر 3 دقائق في كل رد حين تصلح مسودته، ودقته المقيسة 80%، ويراجع الموظف كل مسودة في دقيقة واحدة. كم يوفر لكل مسودة في المتوسط؟</p><ul><li><b>أ.</b> 1.4 دقيقة: 0.8 × 3 − 1</li><li><b>ب.</b> 2.4 دقيقة: 0.8 × 3</li><li><b>ج.</b> 2.0 دقيقة: 3 − 1 لكل مسودة</li><li><b>د.</b> 3.0 دقائق، فكل مسودة توفر ثلاث دقائق</li></ul></li>
<li><p>خياران لمساعد محاضر التفتيش: X يتعادل في الشهر 20، وصافي قيمته في ثلاث سنوات 150,000؛ وY يتعادل في الشهر 30، وصافي قيمته 260,000. قاعدة الجهة: الاسترداد خلال 24 شهرًا. ماذا توصي؟</p><ul><li><b>أ.</b> Y، لأن صافي قيمته في ثلاث سنوات أكبر من X بفارق كبير</li><li><b>ب.</b> Y، بشرط أن تمدد الجهة قاعدة الاسترداد إلى 36 شهرًا</li><li><b>ج.</b> X، لأنه وحده يستوفي قاعدة الاسترداد</li><li><b>د.</b> لا هذا ولا ذاك: نؤجل القرار حتى تتوفر سنة من البيانات</li></ul></li>
<li><p>جهة تريد نظامًا يمنح كل متقدم لدعم الإيجار «درجة التزام» من نشاطه في وسائل التواصل، فتتأخر طلبات أصحاب الدرجات المنخفضة. في أي مستوى من مستويات المخاطر في مبادئ أخلاقيات الذكاء الاصطناعي يقع؟</p><ul><li><b>أ.</b> مخاطر محدودة، تكفيها المبادئ</li><li><b>ب.</b> مخاطر عالية تُعالج بضوابط ورقابة</li><li><b>ج.</b> مخاطر غير مقبولة</li><li><b>د.</b> مخاطر منخفضة أو منعدمة</li></ul></li>
<li><p>مساعد يقترح على موظف الإسكان قبول طلب دعم الإيجار أو رفضه، والموظف يقرر. ثم تقترح الإدارة أن يرسل المساعد القرار مباشرة إلى المتقدم. ما الذي يتغير؟</p><ul><li><b>أ.</b> لا شيء، فالنموذج نفسه والبيانات نفسها</li><li><b>ب.</b> تنخفض المخاطر لأن الخطأ البشري في القرار يختفي تمامًا من الإجراء</li><li><b>ج.</b> يتغير مستوى الأمان السيبراني وحده</li><li><b>د.</b> ترتفع المخاطر: قرار يمس مال شخص دون مراجعة</li></ul></li>
<li><p>خطر في مساعد لإدارة الحجوزات: «يظهر في المسودة رقم جوال مستأجر سابق للقاعة». أي سطر يصلح ضابطًا في ورقة الفحص؟</p><ul><li><b>أ.</b> تُحذف الجوالات قبل الاسترجاع، ويُختبر ذلك كل إصدار بمسؤول</li><li><b>ب.</b> يحرص الموظفون على حماية بيانات المستأجرين في كل ردودهم على السكان</li><li><b>ج.</b> يُطلب من النموذج في الأمر ألا يذكر أي رقم جوال</li><li><b>د.</b> يُضاف إخلاء مسؤولية في نهاية كل رد يذكر الحجز</li></ul></li>
<li><p>عرض مورد يرسل نص الاستفسار مع اسم المستفيد وجواله إلى خدمة سحابية خارج المملكة. ما الذي يلزم قبل أن يعبر هذا الخيار بوابة المخاطر؟</p><ul><li><b>أ.</b> موافقة لجنة التوجيه على التكلفة الإضافية للخيار</li><li><b>ب.</b> شرط في العقد يمنع المورد من نشر البيانات أو بيعها لأي طرف ثالث</li><li><b>ج.</b> استضافة محلية، أو تقييم للنقل مع تقليل ما يُرسل</li><li><b>د.</b> تشفير الاتصال بين الجهة والمورد فقط</li></ul></li>
<li><p>عرض سعر لمساعد ذكي يشمل الترخيص والتهيئة والتكامل. أي بند يغيب عادة ويجب إضافته إلى التكلفة الإجمالية للملكية؟</p><ul><li><b>أ.</b> ضريبة القيمة المضافة على الترخيص</li><li><b>ب.</b> التقييم الدوري وصيانة المحتوى ودقائق المراجعة</li><li><b>ج.</b> تكلفة الاجتماعات مع المورد قبل التعاقد</li><li><b>د.</b> قيمة الأجهزة التي يملكها الموظفون أصلًا</li></ul></li>
<li><p>خيار تكلفته في البداية 120,000 ريال، ومنافعه 15,000 ريال في الشهر، وتكاليف تشغيله 5,000 ريال في الشهر. متى نقطة التعادل؟</p><ul><li><b>أ.</b> بعد 8 أشهر</li><li><b>ب.</b> بعد 12 شهرًا</li><li><b>ج.</b> بعد 20 شهرًا</li><li><b>د.</b> بعد 6 أشهر</li></ul></li>
<li><p>في تحليل الحساسية لمساعد محاضر التفتيش، رفع أجر الدقيقة 10% لم يغيّر الترتيب، وخفض الحجم 20% أبقى الخيار موجبًا، وانخفاض الدقة إلى الحد الأدنى لفترة الثقة جعله سالبًا. ماذا تكتب في التوصية؟</p><ul><li><b>أ.</b> التوصية آمنة، فافتراضان من ثلاثة لم يغيّرا النتيجة في التحليل</li><li><b>ب.</b> نؤجل القرار حتى يرتفع حجم المحاضر في السنة القادمة</li><li><b>ج.</b> توصية مشروطة بدقة مقيسة في تجربة أوسع، مع موعد مراجعة</li><li><b>د.</b> نوصي بالخيار الأرخص في عرض السعر دون شروط</li></ul></li>
<li><p>أي مؤشر منفعة يصلح لمتابعة مساعد يصوغ الردود بعد إطلاقه؟</p><ul><li><b>أ.</b> عدد المسودات التي أنتجها المساعد كل شهر</li><li><b>ب.</b> رضا فريق المشروع عن أداء المساعد</li><li><b>ج.</b> عدد الموظفين الذين يدخلون إلى المساعد كل أسبوع</li><li><b>د.</b> وسيط زمن المعالجة في الفئات المشمولة بعد 90 يومًا</li></ul></li>
</ol>
